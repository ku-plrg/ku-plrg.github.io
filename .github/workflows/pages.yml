# Builds the site with _next/build.mjs (no Jekyll) and deploys _next/out to GitHub Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued, but do not cancel in-progress deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the full history: lecture slides show their last commit date
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _next/package-lock.json
      - name: Install cwebp (web-sized photos)
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Install dependencies
        run: npm ci
        working-directory: _next
      - name: Build
        run: node build.mjs
        working-directory: _next
        env:
          # dates such as a slide's last update are shown in Korean time
          TZ: Asia/Seoul
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _next/out
          # keep .well-known/
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
